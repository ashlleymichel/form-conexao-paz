<style>
    /* Estilos globais e refinados para garantir a formatação correta */
    .form-conexao-wrapper, 
    .form-conexao-wrapper * {
        box-sizing: border-box !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    .form-conexao-wrapper {
        width: 100% !important;
        max-width: 800px !important;
        margin: 0 auto !important;
        padding: 10px !important;
    }

    .form-conexao-wrapper .form-group {
        margin-bottom: 20px !important;
        width: 100% !important;
    }

    .form-conexao-wrapper .row {
        display: flex !important;
        gap: 20px !important;
        width: 100% !important;
    }

    .form-conexao-wrapper .col {
        flex: 1 !important;
        display: flex !important;
        flex-direction: column !important;
    }

    .form-conexao-wrapper label {
        display: block !important;
        margin-bottom: 8px !important;
        font-weight: 600 !important;
        font-size: 15px !important;
        color: #333333 !important;
    }

    .form-conexao-wrapper input[type="text"],
    .form-conexao-wrapper input[type="number"],
    .form-conexao-wrapper input[type="tel"],
    .form-conexao-wrapper input[type="date"],
    .form-conexao-wrapper select,
    .form-conexao-wrapper textarea {
        width: 100% !important;
        padding: 12px 15px !important;
        border: 1px solid #ccc !important;
        border-radius: 6px !important;
        font-size: 15px !important;
        background-color: #fafafa !important;
        color: #333333 !important;
        transition: border-color 0.3s, background-color 0.3s !important;
        outline: none !important;
    }

    .form-conexao-wrapper input:focus, 
    .form-conexao-wrapper select:focus, 
    .form-conexao-wrapper textarea:focus {
        border-color: #007BFF !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1) !important;
    }

    .form-conexao-wrapper textarea {
        resize: vertical !important;
    }

    .form-conexao-wrapper .radio-group {
        display: flex !important;
        gap: 25px !important;
        margin-top: 6px !important;
        margin-bottom: 10px !important;
    }

    .form-conexao-wrapper .radio-item {
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
    }

    .form-conexao-wrapper .radio-item input[type="radio"] {
        width: 18px !important;
        height: 18px !important;
        cursor: pointer !important;
        margin: 0 !important;
    }

    .form-conexao-wrapper .radio-item label {
        margin-bottom: 0 !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        font-size: 15px !important;
    }

    .form-conexao-wrapper button.submit-btn {
        width: 100% !important;
        padding: 15px !important;
        background-color: #007BFF !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 6px !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        cursor: pointer !important;
        transition: background-color 0.3s !important;
        margin-top: 10px !important;
    }

    .form-conexao-wrapper button.submit-btn:hover {
        background-color: #0056b3 !important;
    }

    .form-conexao-wrapper button.submit-btn:disabled {
        background-color: #85b8f2 !important;
        cursor: not-allowed !important;
    }

    .form-conexao-wrapper .mensagem-sucesso {
        display: none;
        text-align: center !important;
        background-color: #d1ecf1 !important; 
        color: #0c5460 !important; 
        border: 1px solid #bee5eb !important; 
        padding: 25px !important;
        border-radius: 8px !important;
        font-size: 18px !important;
        font-weight: bold !important;
        margin-top: 20px !important;
        margin-bottom: 20px !important;
    }

    /* Responsividade para telas menores */
    @media (max-width: 768px) {
        .form-conexao-wrapper .row { 
            flex-direction: column !important; 
            gap: 0 !important; 
        }
        .form-conexao-wrapper .col { 
            margin-bottom: 20px !important; 
        }
    }
</style>

<div class="form-conexao-wrapper">
    
    <div id="msg-sucesso" class="mensagem-sucesso">
        Preenchido com sucesso!
    </div>
    
    <button type="button" class="submit-btn" id="btn-novo" style="display: none;">Novo preenchimento</button>

    <form id="form-conexao" action="#" method="POST">
        
        <div class="form-group">
            <label for="campus">Campus:</label>
            <select id="campus" name="campus" required>
                <option value="">Selecione o campus...</option>
                <option value="Barueri">PAZ Church Barueri</option>
                <option value="Alphaville">PAZ Church Alphaville</option>
                <option value="Pq. Imperial">PAZ Church Pq. Imperial</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group row">
            <div class="col">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="0" required>
            </div>
            <div class="col">
                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecione...</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <div class="col">
                <label for="whatsapp">WhatsApp:</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>
            <div class="col">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>
            </div>
        </div>

        <div class="form-group row">
            <div class="col">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
            <div class="col">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>
        </div>

        <!-- PERGUNTA NOVO CONVERTIDO -->
        <div class="form-group">
            <label>Novo convertido?</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="novo-sim" name="novo_convertido" value="Sim" required>
                    <label for="novo-sim">Sim</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="novo-nao" name="novo_convertido" value="Não">
                    <label for="novo-nao">Não</label>
                </div>
            </div>
        </div>

        <!-- PERGUNTA GOSTARIA DE SE ENVOLVER -->
        <div class="form-group">
            <label>Gostaria de se envolver?</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="envolver-sim" name="envolver" value="Sim" required>
                    <label for="envolver-sim">Sim</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="envolver-nao" name="envolver" value="Não">
                    <label for="envolver-nao">Não</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="obs">Obs:</label>
            <textarea id="obs" name="obs" rows="4" placeholder="Alguma observação adicional?"></textarea>
        </div>

        <div class="form-group">
            <label for="recebido_por">Preenchido por:</label>
            <input type="text" id="recebido_por" name="recebido_por" required>
        </div>

        <button type="submit" class="submit-btn" id="btn-enviar">Enviar</button>
    </form>
</div>

<script>
    // 1. Máscara do WhatsApp
    document.getElementById('whatsapp').addEventListener('input', function (e) {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    // 2. Envio para o Google Sheets
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyqSQBTiVJy5tbO4qyn68bpUjy5olvI-3x3SHUGUdLyXzopPozyDSME2dvnZQXuT4w/exec';
    const form = document.getElementById('form-conexao');
    const btnEnviar = document.getElementById('btn-enviar');
    const btnNovo = document.getElementById('btn-novo');

    form.addEventListener('submit', e => {
        e.preventDefault(); 
        btnEnviar.innerText = 'Enviando...';
        btnEnviar.disabled = true; 
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                form.style.display = 'none';
                document.getElementById('msg-sucesso').style.display = 'block';
                btnNovo.style.display = 'block';
            })
            .catch(error => {
                console.error('Erro!', error.message);
                btnEnviar.innerText = 'Erro! Tente novamente.';
                btnEnviar.disabled = false;
            });
    });

    // 3. Botão Novo Preenchimento (Preservando Campus, Data e Responsável)
    btnNovo.addEventListener('click', () => {
        const campusSalvo = document.getElementById('campus').value;
        const dataSalva = document.getElementById('data').value;
        const recebidoPorSalvo = document.getElementById('recebido_por').value;

        document.getElementById('msg-sucesso').style.display = 'none';
        btnNovo.style.display = 'none';
        form.style.display = 'block';
        
        form.reset();
        
        document.getElementById('campus').value = campusSalvo;
        document.getElementById('data').value = dataSalva;
        document.getElementById('recebido_por').value = recebidoPorSalvo;

        btnEnviar.innerText = 'Enviar';
        btnEnviar.disabled = false;
    });
</script>
