<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Conexão – PAZ Church</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #132548;
            --brand-light: #1e3a6e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
        }

        /* ── SPLASH ── */
        #splash {
            position: fixed;
            inset: 0;
            background-color: var(--brand);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-linha {
            width: 48px;
            height: 2px;
            background: rgba(255,255,255,0.35);
            margin-bottom: 28px;
            animation: expandLine 0.8s ease forwards;
            transform-origin: center;
            transform: scaleX(0);
        }

        .splash-titulo {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(26px, 6vw, 46px);
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.06em;
            text-align: center;
            padding: 0 24px;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.8s ease 0.3s forwards;
        }

        .splash-sub {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-top: 14px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.55s forwards;
        }

        .splash-linha-bottom {
            width: 48px;
            height: 2px;
            background: rgba(255,255,255,0.35);
            margin-top: 28px;
            animation: expandLine 0.8s ease 0.15s forwards;
            transform-origin: center;
            transform: scaleX(0);
        }

        @keyframes expandLine { to { transform: scaleX(1); } }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* ── CONTEÚDO ── */
        #conteudo {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 16px;
            opacity: 0;
        }

        #conteudo.visivel {
            animation: fadeIn 0.7s ease forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(19,37,72,0.10);
            padding: 36px 32px;
            width: 100%;
            max-width: 600px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8ecf2;
        }

        .card-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: var(--brand);
            letter-spacing: 0.05em;
        }

        .card-header p {
            font-size: 13px;
            color: #999;
            margin-top: 5px;
            letter-spacing: 0.02em;
        }

        /* ── FORM ── */
        .form-group { margin-bottom: 20px; width: 100%; }
        .row { display: flex; gap: 20px; width: 100%; }
        .col { flex: 1; display: flex; flex-direction: column; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 400;
            font-size: 12px;
            color: var(--brand);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid #dde3ef;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            background-color: #fafbfd;
            color: #222;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--brand);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(19,37,72,0.08);
        }

        .radio-group { display: flex; gap: 20px; margin-top: 5px; margin-bottom: 15px; }
        .radio-item { display: flex; align-items: center; gap: 8px; }
        .radio-item label { margin-bottom: 0; font-weight: 400; text-transform: none; font-size: 15px; color: #333; cursor: pointer; letter-spacing: 0; }
        .radio-item input[type="radio"] { width: 17px; height: 17px; accent-color: var(--brand); cursor: pointer; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--brand);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.1s;
            margin-top: 10px;
        }

        button.submit-btn:hover { background-color: var(--brand-light); }
        button.submit-btn:active { transform: scale(0.99); }

        .mensagem-sucesso {
            display: none;
            text-align: center;
            background-color: #eaf4fb;
            color: var(--brand);
            border: 1px solid #c2dcef;
            padding: 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.03em;
        }

        @media (max-width: 600px) {
            .row { flex-direction: column; gap: 0; }
            .col { margin-bottom: 20px; }
            .card { padding: 24px 18px; }
        }
    </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
    <div class="splash-linha"></div>
    <h1 class="splash-titulo">Formulário Conexão</h1>
    <div class="splash-linha-bottom"></div>
</div>

<!-- CONTEÚDO -->
<div id="conteudo">
    <div class="card">
        <div class="card-header">
            <h1>Formulário Conexão</h1>
            <p>PAZ Church</p>
        </div>

        <div class="form-conexao-wrapper">

            <div id="msg-sucesso" class="mensagem-sucesso">
                Preenchido com sucesso!
            </div>

            <button type="button" class="submit-btn" id="btn-novo" style="display: none;">Novo preenchimento</button>

            <form id="form-conexao" action="#" method="POST">

                <div class="form-group">
                    <label for="campus">Campus</label>
                    <select id="campus" name="campus" required>
                        <option value="">Selecione o campus...</option>
                        <option value="Barueri">PAZ Church Barueri</option>
                        <option value="Alphaville">PAZ Church Alphaville</option>
                        <option value="Pq. Imperial">PAZ Church Pq. Imperial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" name="idade" min="0" required>
                    </div>
                    <div class="col">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" name="sexo" required>
                            <option value="">Selecione...</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                        </select>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="whatsapp">WhatsApp</label>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" maxlength="15" required>
                    </div>
                    <div class="col">
                        <label for="data">Data</label>
                        <input type="date" id="data" name="data" required>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="col">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gostaria de se envolver?</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="envolver-sim" name="envolver" value="Sim" required>
                            <label for="envolver-sim">Sim</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="envolver-nao" name="envolver" value="Não">
                            <label for="envolver-nao">Não</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="obs">Observações</label>
                    <textarea id="obs" name="obs" rows="4" placeholder="Alguma observação adicional?"></textarea>
                </div>

                <div class="form-group">
                    <label for="recebido_por">Preenchido por</label>
                    <input type="text" id="recebido_por" name="recebido_por" required>
                </div>

                <button type="submit" class="submit-btn" id="btn-enviar">Enviar</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Splash some após 2.2s
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
            document.getElementById('conteudo').classList.add('visivel');
        }, 2200);
    });

    // Máscara WhatsApp
    document.getElementById('whatsapp').addEventListener('input', function (e) {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    // Envio para Google Sheets
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyqSQBTiVJy5tbO4qyn68bpUjy5olvI-3x3SHUGUdLyXzopPozyDSME2dvnZQXuT4w/exec';
    const form = document.getElementById('form-conexao');
    const btnEnviar = document.getElementById('btn-enviar');
    const btnNovo = document.getElementById('btn-novo');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnEnviar.innerText = 'Enviando...';
        btnEnviar.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(() => {
                form.style.display = 'none';
                document.getElementById('msg-sucesso').style.display = 'block';
                btnNovo.style.display = 'block';
            })
            .catch(error => {
                console.error('Erro!', error.message);
                btnEnviar.innerText = 'Erro! Tente novamente.';
                btnEnviar.disabled = false;
            });
    });

    // Novo preenchimento
    btnNovo.addEventListener('click', () => {
        const campusSalvo = document.getElementById('campus').value;
        const dataSalva = document.getElementById('data').value;
        const recebidoPorSalvo = document.getElementById('recebido_por').value;

        document.getElementById('msg-sucesso').style.display = 'none';
        btnNovo.style.display = 'none';
        form.style.display = 'block';
        form.reset();

        document.getElementById('campus').value = campusSalvo;
        document.getElementById('data').value = dataSalva;
        document.getElementById('recebido_por').value = recebidoPorSalvo;

        btnEnviar.innerText = 'Enviar';
        btnEnviar.disabled = false;
    });
</script>

</body>
</html>
